<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebEmu by KernelPanic083</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --glass-bg: rgba(30, 30, 38, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-1: #9d4edd; 
            --accent-2: #00b4d8; 
            --text-main: #f8f9fa;
            --text-muted: #8b8c8f;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(157, 78, 221, 0.15), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(0, 180, 216, 0.15), transparent 30%);
            background-attachment: fixed;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        header {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            cursor: pointer;
        }

        
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 260px 1fr 280px;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
            transition: grid-template-columns 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        
        main.game-active {
            grid-template-columns: 260px 1fr 80px;
        }

        .sidebar-left {
            border-radius: 14px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .sidebar-left h3 {
            margin: 0 0 5px 5px;
            font-size: 0.8rem;
            color: var(--accent-2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .console-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .console-item:hover, .console-item.active {
            background: rgba(157, 78, 221, 0.15);
            border-color: var(--accent-1);
            transform: translateX(4px);
        }

        .badge {
            background: rgba(157, 78, 221, 0.2);
            color: #d896ff;
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid rgba(157, 78, 221, 0.4);
        }

        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .game-container {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5),
                        0 0 0 1px rgba(255,255,255,0.05) inset;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .game-placeholder {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-placeholder svg {
            width: 48px;
            height: 48px;
            fill: var(--text-muted);
            opacity: 0.5;
        }

        .game-placeholder h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-right {
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        
        .sidebar-right h3, .btn-text {
            transition: opacity 0.2s ease, width 0.3s;
            white-space: nowrap;
            opacity: 1;
        }

        
        main.game-active .sidebar-right h3,
        main.game-active .btn-text {
            opacity: 0;
            width: 0;
            display: none;
        }

        main.game-active .sidebar-right {
            padding: 20px 10px;
            align-items: center;
        }

        .rom-upload-card {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(0, 180, 216, 0.2));
            border: 1px dashed var(--accent-2);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rom-upload-card:hover {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.35), rgba(0, 180, 216, 0.35));
            box-shadow: 0 0 20px rgba(0, 180, 216, 0.3);
            transform: scale(1.02);
        }

        .rom-upload-card span.icon {
            font-size: 1.8rem;
        }

        .rom-upload-card span.btn-text {
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        #romFile {
            display: none;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        main.game-active .control-btn {
            justify-content: center;
            padding: 12px; 
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(-2px);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    </style>
</head>
<body>

    <header class="glass">
        <div class="logo" onclick="location.reload()">WebEmu</div>
    </header>

    <main id="main-layout">
        
        <aside class="sidebar-left glass">
            <h3>Sistemas</h3>
            <div class="console-item" onclick="seleccionarConsola('nes')">NES <span class="badge">Core</span></div>
            <div class="console-item" onclick="seleccionarConsola('snes')">Super Nintendo <span class="badge">Core</span></div>
            <div class="console-item" onclick="seleccionarConsola('gba')">Game Boy Advance <span class="badge">Core</span></div>
            <div class="console-item" onclick="seleccionarConsola('n64')">Nintendo 64</div>
            <div class="console-item" onclick="seleccionarConsola('nds')">Nintendo DS</div>
            <div class="console-item" onclick="seleccionarConsola('psx')">PlayStation 1</div>
            <div class="console-item" onclick="seleccionarConsola('segaMD')">Sega Genesis</div>
            <div class="console-item" onclick="seleccionarConsola('mame2003')">Arcade / MAME</div>
        </aside>

        
        <section class="center-stage">
            <div class="game-container" id="game-screen">
                <div class="game-placeholder" id="placeholder">
                    <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 6 19.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    <h2>Emulador Inactivo</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin:0;">Selecciona una consola e inserta tu ROM</p>
                </div>
            </div>
        </section>

        
        <aside class="sidebar-right glass">
            <h3>Archivo</h3>
            <div class="rom-upload-card" onclick="document.getElementById('romFile').click()">
                <span class="icon">📥</span>
                <span class="btn-text">Insertar ROM</span>
            </div>
            <input type="file" id="romFile">

            <h3>Controles</h3>
            <div class="action-group">
                <button class="control-btn" title="Reiniciar Juego" onclick="triggerAction('Reiniciar')">
                    <span class="icon">🔄</span> <span class="btn-text">Reiniciar Juego</span>
                </button>
                <button class="control-btn" title="Pantalla Completa" onclick="toggleFullscreen()">
                    <span class="icon">🔲</span> <span class="btn-text">Pantalla Completa</span>
                </button>
                <button class="control-btn" title="Cambiar de Juego" onclick="triggerAction('Cambiar')">
                    <span class="icon">📁</span> <span class="btn-text">Cambiar de Juego</span>
                </button>
            </div>
        </aside>
    </main>

    <script>
        
        function precargarCoresLigeros() {
            const coresParaPrecargar = ['nes', 'snes', 'gba', 'segaMD']; 
            const baseUrl = 'https://cdn.emulatorjs.org/stable/data/';

            console.log("🎮 Iniciando descarga silenciosa de núcleos en caché...");

            coresParaPrecargar.forEach(core => {
                // Fetch descarga el núcleo en segundo plano y el navegador lo guarda
                fetch(`${baseUrl}${core}.js`).catch(() => {});
                fetch(`${baseUrl}${core}.wasm`).catch(() => {});
            });
        }

        
        window.addEventListener('load', () => {
            if (window.location.protocol === 'file:') {
                alert("¡AVISO IMPORTANTE!\nPara que los juegos carguen, debes abrir esta página mediante un servidor local (Localhost) y no con doble clic, o la pantalla se quedará trabada.");
            } else {
                
                setTimeout(precargarCoresLigeros, 2000);
            }
        });

        let coreSeleccionado = null;

        function seleccionarConsola(core) {
            coreSeleccionado = core;
            document.querySelectorAll('.console-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function triggerAction(actionName) {
            if (actionName === 'Cambiar') {
                location.reload(); 
            } else if (actionName === 'Reiniciar') {
                if (window.EJS_emulator) {
                    window.EJS_emulator.restart();
                }
            }
        }

        function toggleFullscreen() {
            const gameScreen = document.getElementById('game-screen');
            if (!document.fullscreenElement) {
                gameScreen.requestFullscreen().catch(err => {
                    alert(`No se pudo activar: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        document.getElementById('romFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // ANIMACIÓN: Agregar la clase que encoge la barra derecha
            document.getElementById('main-layout').classList.add('game-active');

            const placeholder = document.getElementById('placeholder');
            if (placeholder) placeholder.style.display = 'none';

            window.EJS_player = '#game-screen';
            window.EJS_gameUrl = URL.createObjectURL(file);
            
            let ext = file.name.split('.').pop().toLowerCase();
            
            if (coreSeleccionado) {
                window.EJS_core = coreSeleccionado;
            } else {
                if (ext === 'gba') window.EJS_core = 'gba';
                else if (ext === 'nes') window.EJS_core = 'nes';
                else if (ext === 'sfc' || ext === 'smc') window.EJS_core = 'snes';
                else if (ext === 'z64' || ext === 'n64') window.EJS_core = 'n64';
                else if (ext === 'nds') window.EJS_core = 'nds';
                else if (ext === 'bin' || ext === 'cue' || ext === 'chd') window.EJS_core = 'psx';
                else if (ext === 'gen' || ext === 'md' || ext === 'bin') window.EJS_core = 'segaMD';
                else if (ext === 'zip') window.EJS_core = 'mame2003';
                else window.EJS_core = 'gba'; 
            }

            window.EJS_biosUrl = '';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            const oldScript = document.getElementById('ejs-loader');
            if (oldScript) oldScript.remove();

            let script = document.createElement('script');
            script.id = 'ejs-loader';
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
